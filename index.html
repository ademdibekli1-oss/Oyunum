/* ===== Harita renkleri: kalıcı, birbirinden ayırt edilebilir ===== */
const SC_K='rr-scol';
(function(){try{const d=JSON.parse(localStorage.getItem(SC_K)||'{}');Object.keys(d).forEach(k=>{if(/^#[0-9a-f]{6}$/i.test(d[k])&&S&&S.states&&S.states[k])SCOL[k]=d[k];});}catch(e){}})();
let scolLast='';
function scolSave(){try{const j=JSON.stringify(SCOL);if(j!==scolLast){scolLast=j;localStorage.setItem(SC_K,j);}}catch(e){}}
const scolRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const scolDist=(a,b)=>{const x=scolRGB(a),y=scolRGB(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]);};
/* iki devletin rengi birbirine çok yakınsa sonradan gelen (otomatik atanan) devletin rengi ayırt edilir hâle getirilir */
function scolSeparate(){let ch=0;const ks=Object.keys(S.states||{}).filter(k=>SCOL[k]);
  const fixed=new Set(['A','K','D','G','B','O','M','L','P']);
  ks.forEach(k=>{if(fixed.has(k))return;let t=0;while(t++<12&&ks.some(o=>o!==k&&scolDist(SCOL[k],SCOL[o])<55)){const [r,g,b]=scolRGB(SCOL[k]);const h=x=>('0'+Math.max(30,Math.min(235,x)).toString(16)).slice(-2);SCOL[k]='#'+h((r+70)%256)+h((g+130)%256)+h((b+190)%256);ch=1;}});
  if(ch&&typeof GEO!=='undefined'){GEO.inflK='';GEO.brdK='';}return ch;}
{const _r=render;render=function(){try{scolSeparate();scolSave();}catch(e){}return _r.apply(this,arguments);};}

    for(let i=0;i<7;i++){const x=R()*W,y=118+R()*26;s+=`<ellipse cx="${x}" cy="${y}" rx="${8+R()*14}" ry="${2+R()*3}" fill="#55585e"/>`;}
    return s+`<rect x="40" y="96" width="26" height="16" rx="8" fill="#e6edf3" opacity=".9"/><rect x="60" y="102" width="30" height="9" rx="3" fill="#9fb3c8"/></svg>`;}
  const sky=oil?['#2c1f2b','#e07a3f']:gold?['#26324d','#f3c969']:['#1b2f52','#7fb4e5'];
  s+=`<defs><linearGradient id="sk${r.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#sk${r.id})"/>`;
  s+=`<circle cx="${60+R()*200}" cy="${34+R()*22}" r="${14+R()*6}" fill="${gold?'#ffe08a':'#fff3c4'}" opacity=".9"/>`;

   Yalnızca Vekil açıkken ve "Ekonomi" alanı OTONOM ise çalışır; harcamalar Vekil'in günlük sınırına tabidir. ===== */
const VKK={t:0,busy:0,last:''};
const vkKeepCfg=()=>{const c=vkCfg();if(!c.keep)c.keep={on:1,min:{gold:5,oil:30,ore:30},hi:0.7};if(c.keep.on===undefined)c.keep.on=1;return c.keep;};
async function vkKeepRun(force){
  if(VKK.busy)return;const c=vkCfg(),K=vkKeepCfg();
  if(!c.on||c.modes.eco!=='auto'||!K.on)return;if(VK.kill&&(VK.kill.all||VK.kill.ai))return;
  if(!force&&Date.now()-VKK.t<60e3)return;VKK.t=Date.now();VKK.busy=1;
  const done=[],m=S.me,cap=storCap();
  const step=async(name,fn)=>{try{const r=await fn();if(r)done.push(r);}catch(e){}};
  try{
    // 1) fabrika stoklarını depoya al
    if((m.facs||[]).some(f=>f.stock>=1))await step('fac',()=>VK_X.facCollect());
    // 2) enerji varsa çalış: önce en boş depoyu doldur, yoksa en kârlı kaynağa
    if(!m.travel&&m.energy>=energyCost()){
      const need=['gold','oil','ore'].map(r=>[r,(K.min[r]||0)-(m.stor[r]||0)]).sort((a,b)=>b[1]-a[1]);
      const r=need[0][1]>0?need[0][0]:'gold';
      await step('work',()=>VK_X.work({r:r,n:'all'}));
    }
    // 3) fazla stoğu sat (depo %70'i aşarsa %50'ye kadar); fiyat çok düşükse satma
    for(const r of ['gold','oil','ore']){const have=m.stor[r]||0;
      if(have>cap*K.hi&&(S.prices[r]||0)>=PRICE0[r]*0.9){await step('sell',()=>VK_X.sell({r:r,n:Math.floor(have-cap*0.5),min:Math.floor(PRICE0[r]*0.9)}));}}
    // 4) üretim hattı boşsa üret (bütçe sınırlı)
    if(!(m.craftQ||[]).length){const cand=(vkSnap().uretilebilir||[]).filter(x=>x.para>0).sort((a,b)=>b.para-a.para)[0];
      if(cand)await step('craft',()=>VK_X.craft({k:cand.k,n:1}));}
    // 5) depo hâlâ asgarinin altındaysa ve enerji yoksa pazardan tamamla (fiyat makulse)
    for(const r of ['gold','oil','ore']){const lack=(K.min[r]||0)-(m.stor[r]||0);
      if(lack>0&&m.energy<energyCost()&&(S.prices[r]||0)<=PRICE0[r]*1.3){await step('buy',()=>VK_X.buy({r:r,n:Math.ceil(lack),max:Math.ceil(S.prices[r]*1.2)}));}}
  }finally{VKK.busy=0;}
  if(done.length){VKK.last=done.join(' · ');const id='k'+Date.now();
    VK.log.unshift({id:id,t:Date.now(),by:'cli',k:'keep',ok:1,x:'🧰 Bakım: '+VKK.last});VK.log=VK.log.slice(0,60);S.dirty=true;try{render();}catch(e){}}
}

function gtTr(t){const s=t.trim();if(!s)return t;if(EN[s])return t.replace(s,EN[s]);
  let o=t,ch=0;for(const k of ENK){if(k.length>3&&o.indexOf(k)>=0){o=o.split(k).join(EN[k]);ch=1;}}return ch?o:t;}
function gtWalk(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);const L=[];let n;while((n=w.nextNode())){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(p.nodeName))continue;L.push(n);}
  L.forEach(n=>{const v=gtTr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});}
function gtLangInit(){if(!isEN())return;document.documentElement.lang='en';let busy=0;
  const run=()=>{if(busy)return;busy=1;try{gtWalk(document.body);}finally{busy=0;}};
  new MutationObserver(()=>{setTimeout(run,0);}).observe(document.body,{childList:true,subtree:true,characterData:true});run();}

  return `<div class="gt-strip">${T.map(t=>`<button class="gt-chip" data-a="tab" data-t="${t[0]}"><span>${t[1]}</span><b>${t[2]}</b><small>${t[3]}</small></button>`).join('')}</div>`;}

const VC={list:null,err:''};
async function vcLoad(){try{VC.list=(await MP.fb('GET','verify'))||{};VC.err='';}catch(e){VC.err=String(e.message||e);VC.list={};}S.dirty=true;render();}
ACT.vcLoad=()=>vcLoad();
ACT.vcDel=async d=>{try{await MP.fb('DELETE','verify/'+d.id);}catch(e){}vcLoad();};
function tabVcodes(){
  if(!isAdminUI())return '<div class="panel"><div class="al warn">Bu ekran yalnızca yönetici hesabına açıktır.</div></div>';
  if(VC.list===null&&MP.ok)vcLoad();

  return `<div class="panel"><h2>🔑 Doğrulama kodları</h2><p class="hint">Kayıt olan oyuncuların e-posta doğrulama kodları burada görünür. Oyuncuya kodu sen iletirsin (gerçek e-posta gönderimi yok). Doğrulananlar ✅ ile işaretlenir.</p>

/* ---------- giriş kapısı ---------- */
const GT={mode:'login',step:'form',code:'',err:'',busy:0,em:''};
function gtClose(v){gtSet(v);const e=document.getElementById('gtgate');if(e)e.remove();try{S.dirty=true;render();}catch(x){}}
function gtDraw(){
  let g=document.getElementById('gtgate');if(!g){g=document.createElement('div');g.id='gtgate';document.body.appendChild(g);}
  const inp=(id,ph,ty)=>`<input id="${id}" type="${ty||'text'}" placeholder="${ph}" autocomplete="off" autocapitalize="none">`;
  let b;
  if(GT.step==='code')b=`<h1>📧 Doğrulama</h1><p class="dim">${esc(GT.em)} için bir kod hazırlandı. Kodu yönetici sana iletir; aldığında aşağıya yaz.</p>${inp('gtC','6 haneli kod','tel')}<div class="er">${esc(GT.err)}</div><button class="g p" data-g="chk">Doğrula</button><button class="g" data-g="resend">Yeni kod iste</button><button class="g" data-g="guest">Sonra doğrularım, misafir devam et</button>`;
  else b=`<h1>⚔️ Bilâd-ı Mütenâfise</h1><p class="dim" style="margin:0 0 6px">Oyuna girmek için hesabınla giriş yap.</p><div class="tb"><button class="${GT.mode==='login'?'on':''}" data-g="m-login">Giriş yap</button><button class="${GT.mode==='register'?'on':''}" data-g="m-register">Kayıt ol</button></div>${GT.mode==='register'?inp('gtN','Oyuncu adı')+inp('gtE','E-posta','email'):inp('gtE','Kullanıcı adı veya e-posta')}${inp('gtP','Şifre (en az 6)','password')}<div class="er">${GT.busy?'Bağlanıyor…':esc(GT.err)}</div><button class="g p" data-g="go">${GT.mode==='login'?'Giriş yap':'Kayıt ol ve kod al'}</button><button class="g" data-g="guest">Misafir olarak devam et</button><p class="dim" style="font-size:12px;margin:8px 0 0">${isEN()?'':''}Dil: <a href="#" data-g="en" style="color:var(--gold)">English</a> · <a href="#" data-g="tr" style="color:var(--gold)">Türkçe</a></p>`;
  g.innerHTML=`<div class="gb">${b}</div>`;
}
async function gtSendCode(){
  const code=String(100000+Math.floor(Math.random()*900000));GT.code=code;
  try{await MP.fb('PUT','verify/'+MP.uid(),{em:GT.em,n:(MP.cfg&&MP.cfg.name)||'',code:code,t:Date.now()});}catch(e){GT.err='Kod yöneticiye iletilemedi: '+String(e.message||e).slice(0,80);}
}
async function gtGo(){
  const v=id=>((document.getElementById(id)||{}).value||'').trim(),user=v('gtE'),pass=(document.getElementById('gtP')||{}).value||'';
  if(!user||!pass){GT.err='Alanları doldur.';return gtDraw();}
  if(GT.mode==='register'&&user.indexOf('@')<1){GT.err='Kayıt için geçerli bir e-posta gir.';return gtDraw();}
  GT.busy=1;GT.err='';gtDraw();
  try{
    const old=MP.cfg||{};MP.cfg={key:old.key||DEF_KEY,url:old.url||DEF_URL,name:(v('gtN')||user.split('@')[0]||old.name||'Oyuncu').slice(0,20)};
    await MP.account(GT.mode,user,pass);MP.saveCfg();await MP.connect();
    if(!MP.ok)throw new Error(MP.err||'Bağlanılamadı');
    GT.busy=0;
    if(GT.mode==='register'){GT.em=user.toLowerCase();await gtSendCode();GT.step='code';return gtDraw();}
    return gtClose('ok');
  }catch(e){GT.busy=0;GT.err=String(e.message||e).replace(/EMAIL_EXISTS/,'Bu hesap zaten var').replace(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/,'Kullanıcı veya şifre hatalı');gtDraw();}
}
document.addEventListener('click',async e=>{const t=e.target.closest&&e.target.closest('#gtgate [data-g]');if(!t)return;e.preventDefault();const a=t.dataset.g;
  if(a==='m-login'||a==='m-register'){GT.mode=a.slice(2);GT.err='';gtDraw();}
  else if(a==='go')gtGo();
  else if(a==='guest')gtClose('guest');
  else if(a==='en'||a==='tr'){PREF.lang=a;prefSave();location.reload();}
  else if(a==='resend'){await gtSendCode();GT.err=GT.err||'Yeni kod hazırlandı.';gtDraw();}
  else if(a==='chk'){const c=((document.getElementById('gtC')||{}).value||'').trim();
    if(c&&c===GT.code){try{await MP.fb('PATCH','verify/'+MP.uid(),{ok:1});}catch(x){}try{S.me.verified=1;}catch(x){}gtClose('ok');}else{GT.err='Kod yanlış.';gtDraw();}}
},true);
function gtMaybe(){
  const v=gtGet();if(v)return;
  if(navigator.webdriver&&!window.__gateTest)return; // otomatik testlerde kapı kapalı
  if(MP.auth&&MP.auth.user){gtSet('ok');return;}
  gtDraw();
}
window.addEventListener('load',()=>{setTimeout(()=>{try{gtLangInit();prefApply();gtMaybe();}catch(e){}},600);});
window.addEventListener('unhandledrejection',function(ev){

  var d=document.createElement('div');d.className='al warn';
  d.textContent='⚠️ Hata: '+String(ev.reason&&ev.reason.message||ev.reason).slice(0,160);
  m.appendChild(d);setTimeout(function(){d.remove();},12000);
});

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}

try{init();}catch(e){var m=document.getElementById("main");if(m)m.innerHTML="<pre style=\"white-space:pre-wrap;color:#f85149\">Hata: "+String(e&&e.stack||e)+"</pre>";}
